[package]
name = "tif1_native"
version = "0.1.0"
edition = "2021"
description = "Optional native accelerators for tif1 (telemetry payload decoder)"
license = "MIT"

[lib]
name = "tif1_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
numpy = "0.29"
fast-float2 = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
