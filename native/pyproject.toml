[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "tif1-native"
# The version comes from Cargo.toml (one source of truth for the crate and the wheel).
dynamic = ["version"]
description = "Optional native accelerators for tif1 (telemetry payload decoder)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/TracingInsights/tif1"
Repository = "https://github.com/TracingInsights/tif1/tree/main/native"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "tif1_native"
