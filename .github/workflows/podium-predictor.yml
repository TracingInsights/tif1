name: Optional podium predictor tests

on:
  pull_request:
    paths:
      - "examples/podium_predictor/**"
      - "tests/unit/test_podium_predictor_example.py"
      - "src/tif1/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/podium-predictor.yml"
  push:
    branches: [main]
    paths:
      - "examples/podium_predictor/**"
      - "tests/unit/test_podium_predictor_example.py"
      - "src/tif1/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/podium-predictor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optional-model-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.10.2"
      - name: Install tif1 and development tools
        run: python -m uv sync --all-extras --python "${{ matrix.python-version }}"
      - name: Install optional model dependencies
        run: python -m uv pip install -r examples/podium_predictor/requirements.txt
      - name: Lint the optional example and discovery bridge
        run: >-
          python -m uv run --no-sync ruff check --config 'extend-exclude=[]'
          examples/podium_predictor tests/unit/test_podium_predictor_example.py
      - name: Check optional example formatting
        run: >-
          python -m uv run --no-sync ruff format --check --config 'extend-exclude=[]'
          examples/podium_predictor tests/unit/test_podium_predictor_example.py
      - name: Run isolated offline example suite
        run: >-
          python -m uv run --no-sync pytest -o addopts=''
          tests/unit/test_podium_predictor_example.py -v -n 0 --no-cov
