name: Release Discussion

on:
  release:
    types: [published]

# discussions:write is not granted by default — must be explicit
permissions:
  discussions: write
  contents: read

jobs:
  create-discussion:
    name: Open release discussion
    runs-on: ubuntu-latest

    steps:
      - name: Create discussion via GitHub GraphQL API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          # release.name can be blank if author left it empty; fall back to tag
          RELEASE_NAME: ${{ github.event.release.name || github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          python3 .github/scripts/create-release-discussion.py