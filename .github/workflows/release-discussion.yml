name: Release Discussion

on:
  release:
    types: [published]

# discussions:write is not granted by default — must be explicit
permissions:
  discussions: write
  contents: read

jobs:
  create-discussion:
    name: Open release discussion
    runs-on: ubuntu-latest

    steps:
      - name: Create discussion via GitHub GraphQL API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          # release.name can be blank if author left it empty; fall back to tag
          RELEASE_NAME: ${{ github.event.release.name || github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          python3 << 'PYEOF'
          import os
          import json
          import subprocess
          import sys

          owner        = os.environ["REPO_OWNER"]
          repo         = os.environ["REPO_NAME"]
          tag          = os.environ["RELEASE_TAG"]
          name         = os.environ["RELEASE_NAME"] or tag
          body_raw     = os.environ["RELEASE_BODY"]
          release_url  = os.environ["RELEASE_URL"]
          is_prerelease = os.environ["IS_PRERELEASE"].lower() == "true"

          # ── helpers ──────────────────────────────────────────────────────────

          def graphql(query: str, variables: dict) -> dict:
              payload = json.dumps({"query": query, "variables": variables})
              result = subprocess.run(
                  ["gh", "api", "graphql", "--input", "-"],
                  input=payload,
                  capture_output=True,
                  text=True,
              )
              if result.returncode != 0:
                  print("GraphQL error:", result.stderr, file=sys.stderr)
                  sys.exit(1)
              data = json.loads(result.stdout)
              if "errors" in data:
                  print("GraphQL errors:", data["errors"], file=sys.stderr)
                  sys.exit(1)
              return data["data"]

          # ── 1. resolve repo node ID + discussion categories ──────────────────

          meta = graphql(
              """
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  id
                  discussionCategories(first: 20) {
                    nodes { id name }
                  }
                }
              }
              """,
              {"owner": owner, "repo": repo},
          )

          repo_id    = meta["repository"]["id"]
          categories = meta["repository"]["discussionCategories"]["nodes"]

          if not categories:
              print("No discussion categories found. Enable Discussions and add at least one category.", file=sys.stderr)
              sys.exit(1)

          # Prefer "Announcements", then any name containing "announce",
          # then the first category available.
          def pick_category(cats):
              for c in cats:
                  if c["name"].lower() == "announcements":
                      return c
              for c in cats:
                  if "announce" in c["name"].lower():
                      return c
              return cats[0]

          category = pick_category(categories)
          print(f"Using discussion category: {category['name']!r}")

          # ── 2. build the discussion body ──────────────────────────────────────

          # Strip leading 'v' for the pip install line (v0.3.1 → 0.3.1)
          pip_version = tag.lstrip("v")

          prerelease_banner = (
              "> [!WARNING]\n"
              "> This is a **pre-release**. APIs may change before the stable release. "
              "Use with caution in production.\n\n"
              if is_prerelease else ""
          )

          release_notes_section = (
              f"## What's changed\n\n{body_raw.strip()}\n\n"
              if body_raw.strip()
              else "## What's changed\n\n_No release notes provided._\n\n"
          )

          discussion_body = f"""\
{prerelease_banner}\
{release_notes_section}\
---

## Install

```bash
pip install tif1=={pip_version}
```

Or upgrade an existing installation:

```bash
pip install --upgrade tif1
```

---

## Links

- 📋 [Full release notes & assets]({release_url})
- 📦 [tif1 on PyPI](https://pypi.org/project/tif1/{pip_version}/)
- 📚 [Documentation](https://tif1.tracinginsights.com)
- 🐛 [Report a bug](https://github.com/{owner}/{repo}/issues/new?labels=bug&template=bug_report.md)
- 💬 [Ask a question](https://github.com/{owner}/{repo}/discussions/new?category=q-a)

---

*This discussion was automatically created when **{tag}** was published.*
"""

          # ── 3. create the discussion ──────────────────────────────────────────

          title = f"🚀 {name}" if name != tag else f"🚀 Release {tag}"

          result = graphql(
              """
              mutation($repoId: ID!, $catId: ID!, $title: String!, $body: String!) {
                createDiscussion(input: {
                  repositoryId: $repoId
                  categoryId:   $catId
                  title:        $title
                  body:         $body
                }) {
                  discussion { url number }
                }
              }
              """,
              {
                  "repoId": repo_id,
                  "catId":  category["id"],
                  "title":  title,
                  "body":   discussion_body,
              },
          )

          discussion = result["createDiscussion"]["discussion"]
          print(f"Discussion created: {discussion['url']}")
          PYEOF