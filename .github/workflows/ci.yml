name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: "0.10.2"
  DEFAULT_PYTHON: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

      - name: Install dependencies
        run: python -m uv sync --all-extras

      - name: Run prek checks
        run: python -m uv run prek run --all-files --show-diff-on-failure

  test:
    runs-on: ${{ matrix.os }}
    # A full run takes ~3 minutes; a hung xdist worker must fail the job, not
    # hold a runner until GitHub's 6-hour default.
    timeout-minutes: 25
    # The Windows legs are advisory (continue-on-error): they prove the suite
    # runs there without blocking a release. 3.11 keeps Windows' legacy code
    # page as the default encoding; 3.15 would hide encoding bugs behind
    # UTF-8 mode, so it stays Linux-only.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.14"
    defaults:
      run:
        # PowerShell would read "uv==${UV_VERSION}" as an unset variable.
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          # Resolve to the latest stable patch when one exists; fall back to a
          # release candidate for a just-released minor (e.g. 3.15) that the
          # setup-python manifest has not picked up yet.
          allow-prereleases: true

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

      - name: Install dependencies
        run: python -m uv sync --all-extras

      - name: Run unit tests
        run: |
          python -m uv run pytest -o addopts='' -o faulthandler_timeout=300 tests/ -v -n auto --dist=loadfile --cov=src/tif1 --cov-report=xml --cov-report=term --cov-fail-under=80 -m "not slow and not integration and not benchmark"

      - name: Run integration tests
        if: matrix.python-version == env.DEFAULT_PYTHON && runner.os == 'Linux'
        run: |
          python -m uv run pytest -o addopts='' tests/ -v -n 0 --cov=src/tif1 --cov-append --cov-report=xml --cov-report=term -m integration

  native:
    # The unit suite again with the tif1-native decoder (native/) built from
    # this commit and importable: the matrix above runs the pure-Python
    # (orjson) path, and frames must not depend on which decoder ran.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

      - name: Install dependencies
        run: python -m uv sync --all-extras

      - name: Build and install tif1-native
        # After the sync (uv sync prunes packages outside the lock); the tests
        # then run with --no-sync. The runner image ships a Rust toolchain.
        run: |
          python -m uv tool run maturin build --release -m native/Cargo.toml -i .venv/bin/python -o native-dist
          python -m uv pip install --no-deps native-dist/*.whl

      - name: Check the native decoder is active
        run: |
          python -m uv run --no-sync python -c "from tif1.core_utils import json_utils as j; assert j.NATIVE_TELEMETRY_DECODER_AVAILABLE and j.native_dictionary_channels()"

      - name: Run unit tests (native decoder)
        run: |
          python -m uv run --no-sync pytest -o addopts='' -o faulthandler_timeout=300 tests/unit -n auto --dist=loadfile -q -m "not slow and not integration and not benchmark"

  pyodide-smoke:
    # tif1 inside Pyodide (Python on WebAssembly): build the wheel, install it
    # with micropip in Node's Pyodide and load a session offline, then online.
    # Fails when a dependency floor outruns the Pyodide distribution
    # (tools/pyodide_target.json) or a browser code path regresses.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

      - name: Build the wheel
        run: python -m uv build --wheel

      - name: Install Pyodide
        run: |
          PYODIDE_VERSION=$(python -c "import json; print(json.load(open('tools/pyodide_target.json'))['pyodide'])")
          npm install --no-save "pyodide@${PYODIDE_VERSION}"

      - name: Run the Pyodide smoke test
        env:
          TIF1_SMOKE_NETWORK: "1"
        run: node --experimental-wasm-jspi tools/pyodide_smoke.mjs dist/tif1-*.whl

      - name: Install Playwright browsers
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium firefox

      - name: Run the Pyodide browser check
        # Chromium (JSPI) and Firefox (no JSPI): main thread, Web Worker,
        # urllib3's XMLHttpRequest path and IndexedDB persistence across a reload.
        env:
          TIF1_SMOKE_NETWORK: "1"
          TIF1_BROWSERS: "chromium,firefox"
        run: node tools/pyodide_browser_check.mjs dist/tif1-*.whl
