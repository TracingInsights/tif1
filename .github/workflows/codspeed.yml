name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  UV_VERSION: "0.10.2"
  DEFAULT_PYTHON: "3.10"

jobs:
  benchmarks-instrumentation:
    name: Benchmarks (CPU Simulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

      - name: Install dependencies
        run: python -m uv sync --all-extras

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4.15.1
        with:
          mode: instrumentation
          run: |
            python -m uv run pytest -o addopts='' tests/benchmarks/ -m benchmark --codspeed --no-cov -n 0

  benchmarks-walltime:
    name: Benchmarks (Wall Time)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

      - name: Install dependencies
        run: python -m uv sync --all-extras

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4.15.1
        with:
          mode: walltime
          run: |
            python -m uv run pytest -o addopts='' tests/benchmarks/ -m benchmark --codspeed --no-cov -n 0

  benchmarks-memory:
    name: Benchmarks (Memory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

      - name: Install dependencies
        run: python -m uv sync --all-extras

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4.15.1
        with:
          mode: memory
          run: |
            python -m uv run pytest -o addopts='' tests/benchmarks/ -m benchmark --codspeed --no-cov -n 0
