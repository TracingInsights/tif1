[project]
name = "tif1"
version = "0.9.0"
description = "A faster alternative to fastf1 with the same bindings. Access Formula 1 timing data from TracingInsights Github cache (2018-current)"
readme = "README.md"
authors = [
    { name = "Tracing Insights", email = "tracing.insights@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = [
    "formula1",
    "f1",
    "motorsport",
    "racing",
    "telemetry",
    "data-analysis",
    "timing-data",
    "lap-times",
]
dependencies = [
    # Pyodide (Python in the browser) resolves the `sys_platform == 'emscripten'`
    # lines: micropip serves the native packages from the Pyodide distribution,
    # so those carry major-only floors (the shipped versions are listed in
    # tools/pyodide_target.json and checked by tests/unit/test_pyproject_markers.py).
    # niquests, polars, rapidfuzz and nest-asyncio2 have no WebAssembly build and
    # stay native-only; tif1.browser fetches through Pyodide's urllib3 instead.
    "pandas>=3.0.6,<4; sys_platform != 'emscripten'",
    "pandas>=3,<4; sys_platform == 'emscripten'",
    "niquests>=3.21.1,<4; sys_platform != 'emscripten'",
    "urllib3>=2.2,<3; sys_platform == 'emscripten'",
    "pydantic>=2.14.0,<3; sys_platform != 'emscripten'",
    "pydantic>=2,<3; sys_platform == 'emscripten'",
    "typer>=0.27.2,<0.28.0",
    "rich>=15.0.0,<16",
    "typing-extensions>=4.16.0,<5",
    "nest-asyncio2>=1.7.2,<2; sys_platform != 'emscripten'",
    "matplotlib>=3.11.2,<4; sys_platform != 'emscripten'",
    "matplotlib>=3,<4; sys_platform == 'emscripten'",
    "seaborn>=0.13.2,<1",
    # scipy 1.18 dropped Python 3.11; 1.18.1 is the first release with 3.15 wheels.
    "scipy>=1.17.1,<2; python_version < '3.15' and sys_platform != 'emscripten'",
    "scipy>=1.18.1,<2; python_version >= '3.15' and sys_platform != 'emscripten'",
    "scipy>=1,<2; sys_platform == 'emscripten'",
    "timple==0.1.8",
    "orjson>=3.12.0,<4; sys_platform != 'emscripten'",
    "orjson>=3,<4; sys_platform == 'emscripten'",
    "rapidfuzz>=3.14.6,<4; sys_platform != 'emscripten'",
    "polars>=2.0.0,<3; sys_platform != 'emscripten'",
    # polars <-> pandas conversion (to_pandas/from_pandas) goes through Arrow.
    "pyarrow>=25.0.1,<27; sys_platform != 'emscripten'",
    "pyarrow>=22,<27; sys_platform == 'emscripten'",
    # Python 3.14+ ships zstd in the standard library (PEP 784); the wheel is
    # only needed on older interpreters (see tif1.cache codec selection).
    "zstandard>=0.25.0,<0.26; python_version < '3.14'",
    # lz4 publishes no cp315 wheels yet; on 3.15 the frame tier falls back to
    # zstd. Drop the marker once lz4 ships 3.15 wheels.
    "lz4>=4.4.5,<5; python_version < '3.15' and sys_platform != 'emscripten'",
    "lz4>=4,<5; python_version < '3.15' and sys_platform == 'emscripten'",
]

[project.urls]
Homepage = "https://github.com/TracingInsights/tif1"
Documentation = "https://tif1.tracinginsights.com"
Repository = "https://github.com/TracingInsights/tif1"
"Bug Tracker" = "https://github.com/TracingInsights/tif1/issues"
Changelog = "https://github.com/TracingInsights/tif1/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-xdist>=3.8.0,<4",
    "pytest-cov>=7.1.0,<8",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-benchmark>=5.3.0,<6",
    "pytest-mock>=3.15.1,<4",
    "ruff>=0.16.6,<0.17.0",
    "ty>=0.0.78,<0.1.0",
    "prek>=0.5.2,<0.6.0",
    "pandas-stubs>=3.0.5.260730,<4",
    "hypothesis>=6.167.1,<7",
]

[project.scripts]
tif1 = "tif1.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tif1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/tif1 --cov-report=term-missing --cov-report=html --cov-report=xml -n auto --dist=loadfile -m \"not benchmark\" --ignore=tests/benchmarks"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: marks tests as unit tests (fast, isolated tests)",
    "integration: marks tests as integration tests (tests with external dependencies)",
    "property: marks tests as property-based tests (using Hypothesis)",
    "benchmark: marks tests as benchmarks (performance tests, excluded by default)",
    "compliance_offline: marks offline fastf1 compatibility checks",
    "compliance_online: marks network-based fastf1 compatibility smoke checks",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "real_cache_dir: opt out of the per-test cache-directory isolation (config default-path tests)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples/", "test_tif1.ipynb", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "DTZ", "T10", "EM", "ISC", "ICN", "PIE", "PT", "Q", "RSE", "RET", "SIM", "TID", "ARG", "PTH", "PD", "PL", "NPY", "PERF", "RUF"]
ignore = ["PLR0913", "PLR2004", "S101", "PLC0415", "PLW0603", "PERF203", "PLR0912", "PLR0911", "PLR0915", "PLR0917", "EM101", "EM102", "RET504", "SIM102", "SIM105", "SIM108", "SIM117", "RUF001", "RUF003", "RUF022", "B904", "B905", "N806", "E501", "PTH123", "ARG001", "PD011", "UP007", "DTZ005", "ISC001", "PLW0108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.11"

[tool.coverage.run]
source = ["src/tif1"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@overload",
    "\\.\\.\\.",
    "pass",
]
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[dependency-groups]
dev = [
    "pip-audit>=2.10.1,<3",
]
